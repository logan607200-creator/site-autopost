sections:
  - h2: 입고 증상
    text: |
      **엔진경고등이 켜진 채 신호 대기 중 차가 떨린다는 증상으로 입고된 기블리입니다.** 고객은 아침 첫 시동 직후 떨림이 가장 심하고, 언덕에서 가속할 때 울컥거림이 느껴진다고 했습니다.

      경고등이 켜진 뒤에도 주행은 가능했지만, 경고등이 깜빡이지 않고 계속 켜져 있는 상태였습니다. 실화가 이어지면 촉매(배기 정화 장치)에 부담이 가기 때문에 장거리 주행은 피하고 입고하도록 안내했습니다.

      예시 사례이므로 연식과 주행거리는 적지 않았습니다. 실제 글에서는 차량 정보와 입고 방식(직접 입고 또는 전국 탁송)을 이 자리에 씁니다.
    photos:
      - {src: assets/maserati-service-01.webp, alt: "마세라티 엔진룸 점검 장면 (참고 사진)", caption: "참고 사진: 실제 글에서는 계기판 경고등 사진이 들어갑니다."}
  - h2: 진단 — 실화 실린더 찾기
    text: |
      **진단기로 고장 기록을 읽어 어느 실린더에서 실화가 났는지부터 확인했습니다.** 실화 관련 고장 코드는 보통 P0300(여러 실린더) 또는 P0301~P0306(특정 실린더) 형태로 남습니다. 이 예시에서는 한 실린더에 실화 기록이 몰려 있었습니다.

      한 실린더에만 실화가 몰린다면 점화코일, 점화플러그, 인젝터, 압축 상태 순서로 의심합니다. 가장 빠르게 가려낼 수 있는 방법은 해당 실린더의 점화코일을 옆 실린더 코일과 바꿔 다는 것입니다.

      코일을 바꿔 단 뒤 다시 시동을 걸고 실화 카운트를 보니, 실화가 코일을 따라 옆 실린더로 옮겨 갔습니다. 이렇게 되면 원인은 점화코일 쪽으로 좁혀집니다. 실화가 그대로 같은 실린더에 남았다면 플러그나 인젝터를 다음으로 확인합니다.
    photos:
      - {src: assets/logan-workshop-01.webp, alt: "로건서비스 작업장에서 정비 중인 테크니션 (참고 사진)", caption: "참고 사진: 실제 글에서는 진단기 고장 코드 화면이 들어갑니다(차대번호 가림)."}
  - h2: 작업 — 점화코일 교체와 플러그 점검
    text: |
      **원인으로 확인된 점화코일을 교체하고, 같은 김에 점화플러그 상태를 함께 확인했습니다.** 코일을 떼어 보면 몸체 균열이나 고무 부트 경화가 보이는 경우가 많고, 이런 부분으로 전기가 새면서 실화가 생깁니다.

      점화플러그는 전극 마모와 그을음 색을 봅니다. 한 실린더 플러그만 유난히 검게 그을려 있다면 그 실린더에 연료가 제대로 타지 않았다는 뜻이라 원인을 다시 확인해야 합니다. 플러그 교체 시기가 가까운 차는 고객과 상의해 함께 교체를 권합니다.

      교체 후 진단기로 고장 기록을 지우고, 공회전 상태에서 실린더별 실화 카운트가 더 올라가지 않는지 지켜봤습니다.

      작업하면서 흡기 쪽 진공 호스와 커넥터 체결 상태도 함께 봤습니다. 점화 계통이 아닌 공기 누설로도 떨림이 생길 수 있어, 원인을 하나로 단정하기 전에 주변을 같이 확인하는 것이 재입고를 줄이는 방법입니다.
    photos:
      - {src: assets/maserati-service-01.webp, alt: "마세라티 엔진 점검 작업 (참고 사진)", caption: "참고 사진: 실제 글에서는 떼어 낸 점화코일과 플러그 사진이 들어갑니다."}
  - h2: 출고 점검
    text: |
      **시운전에서 공회전 떨림과 가속 시 울컥거림이 사라졌고, 엔진경고등도 다시 켜지지 않았습니다.** 냉간 시동, 정체 구간 공회전, 언덕 가속처럼 고객이 증상을 느꼈던 상황을 그대로 다시 재현해 확인했습니다.

      출고하면서 엔진경고등이 다시 켜지거나 깜빡이면 바로 연락해 달라고 안내했습니다. 깜빡이는 경고등은 실화가 심하다는 신호라서 주행을 줄이는 것이 좋습니다.
  - h2: 기블리 엔진경고등이 켜졌다면
    text: |
      **경고등만으로는 원인을 알 수 없으므로 진단기로 고장 기록부터 읽는 것이 먼저입니다.** 같은 엔진경고등이라도 실화, 산소센서, 증발가스 계통, 냉각 계통 등 원인이 여러 가지입니다.

      떨림이 함께 있다면 실화일 가능성이 높고, 경고등이 깜빡인다면 주행을 줄이고 점검을 받는 편이 안전합니다. 로건서비스는 경기도 파주에 있지만 전국 탁송으로도 맡기실 수 있습니다.

      비슷한 증상이 있다면 계기판 경고등 사진을 카톡으로 먼저 보내 주세요.
faq:
  - q: "기블리 엔진경고등이 켜졌는데 계속 타도 되나요?"
    a: "경고등이 켜져만 있고 떨림이 없다면 가까운 시일에 점검을 받으시면 됩니다. 경고등이 깜빡이거나 차가 떨린다면 실화일 가능성이 있어 주행을 줄이고 바로 진단받는 것이 좋습니다."
  - q: "실화가 나면 점화코일만 바꾸면 되나요?"
    a: "꼭 그렇지는 않습니다. 점화플러그, 인젝터, 압축 상태도 원인이 될 수 있어서, 코일 위치를 바꿔 실화가 따라오는지 확인하는 식으로 원인을 먼저 좁힌 뒤 교체합니다."
  - q: "파주가 멀어도 맡길 수 있나요?"
    a: "전국 탁송으로 맡기실 수 있습니다. 지역과 정비 금액에 따라 탁송비를 지원하며, 자세한 내용은 1544-6072로 문의해 주세요."

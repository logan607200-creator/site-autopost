sections:
  - h2: 입고 내용
    text: |
      **계기판에 정기점검 알림이 뜨고 장거리 여행을 앞두고 있어 전체 점검을 원한 포르토피노입니다.** 따로 느껴지는 이상 증상은 없었고, 고객은 주말에만 타고 평소에는 오래 세워 두는 편이라고 했습니다.

      이렇게 주행거리는 짧고 보관 기간이 긴 차는 주행거리보다 시간이 지나 상하는 소모품(오일, 브레이크액, 배터리)을 더 꼼꼼히 봅니다.

      예시 사례이므로 연식과 주행거리는 적지 않았습니다. 실제 글에서는 차량 정보와 입고 방식(직접 입고 또는 전국 탁송)을 이 자리에 씁니다.
    photos:
      - {src: assets/hero-main.webp, alt: "로건서비스 대표 이미지 (참고 사진)", caption: "참고 사진: 실제 글에서는 입고 차량 전체 사진과 서비스 알림이 뜬 계기판 사진이 들어갑니다."}
  - h2: 점검 순서
    text: |
      **진단기로 고장 기록과 서비스 정보를 먼저 읽고, 리프트에 올려 하부부터 위로 점검했습니다.** 경고등이 없더라도 저장된 고장 기록이 있을 수 있어 정기점검 때도 진단기 확인을 빼지 않습니다.

      하부에서는 엔진·변속기 주변 누유, 냉각수 호스 연결부, 브레이크 패드와 디스크 마모, 타이어 마모와 균열을 확인했습니다. 엔진룸에서는 냉각수 양과 색, 벨트 상태, 배선 고정 상태를 봤습니다.

      브레이크액은 수분을 빨아들이는 성질이 있어서 주행이 적은 차도 시간이 지나면 성능이 떨어집니다. 테스터로 수분 함량을 재고 결과를 고객에게 설명했습니다.
    photos:
      - {src: assets/maserati-service-02.webp, alt: "리프트에 올라간 차량 하부 점검 (참고 사진, 마세라티)", caption: "참고 사진: 실제 글에서는 포르토피노 하부 점검 사진이 들어갑니다."}
  - h2: 작업 — 엔진오일·필터 교환과 소모품
    text: |
      **엔진오일과 오일필터를 제조사 규격에 맞는 제품으로 교환했습니다.** 빼낸 오일은 색과 금속 가루 여부를 확인해 엔진 내부 상태를 간접적으로 봅니다.

      에어필터와 에어컨 필터는 꺼내서 오염 상태를 확인했고, 교체가 필요한 것은 고객과 상의해 교체했습니다. 오래 세워 두는 차라 배터리 전압과 상태도 테스터로 확인했습니다.

      교환 후에는 오일 양을 규정 방법대로 다시 확인하고, 서비스 알림을 초기화했습니다.

      브레이크액은 수분 측정 결과를 보고 교환 여부를 고객과 정했습니다. 장거리 주행, 특히 내리막이 긴 길을 앞두고 있다면 브레이크액 상태가 제동 느낌에 영향을 줄 수 있어 이 부분을 자세히 설명했습니다.
  - h2: 포르토피노 점검 때 함께 보는 것
    text: |
      **하드탑 컨버터블이라 루프 작동 상태와 고무 실링도 정기점검 항목에 넣었습니다.** 루프를 여러 번 열고 닫아 작동 소리와 멈춤 위치를 확인했고, 실링 고무가 마르거나 갈라진 곳이 없는지 봤습니다.

      타이어는 마모뿐 아니라 제조 시기와 옆면 균열을 함께 봅니다. 주행이 적은 차는 홈이 충분히 남아 있어도 고무가 굳어 접지력이 떨어질 수 있습니다.

      실내에서는 계기판 경고 기록, 에어컨 바람 세기와 냄새, 창문·미러 작동을 확인했습니다. 작은 전장 오류는 오래 세워 둔 뒤 배터리 전압이 낮아져 생기는 경우도 있어 배터리 점검 결과와 함께 판단합니다.
    photos:
      - {src: assets/logan-workshop-01.webp, alt: "로건서비스 작업장에서 정비 중인 테크니션 (참고 사진)", caption: "참고 사진: 실제 글에서는 오일필터·에어필터 교환 전후 사진이 들어갑니다."}
  - h2: 출고와 관리 안내
    text: |
      **시운전으로 변속, 제동, 소음, 경고등을 확인한 뒤 출고했습니다.** 점검 결과는 바로 교체한 것, 다음 점검 때 볼 것, 지금은 문제없는 것으로 나눠 설명했습니다.

      주말에만 타고 오래 세워 두는 차는 배터리 방전을 막기 위해 유지 충전기 사용을 권했습니다. 오래 세워 둔 뒤 처음 탈 때는 타이어 공기압과 경고등부터 확인하시면 좋습니다.

      로건서비스는 경기도 파주에 있지만 전국 탁송으로도 맡기실 수 있습니다. 점검 시기가 궁금하다면 계기판 서비스 알림 사진을 카톡으로 먼저 보내 주세요.
faq:
  - q: "페라리 엔진오일은 언제 교환해야 하나요?"
    a: "제조사 정비 주기표를 기준으로 하되, 주행이 적어도 시간이 지나면 교환이 필요합니다. 주행거리, 보관 기간, 주행 습관을 함께 보고 안내해 드립니다."
  - q: "오래 세워 둔 페라리도 점검이 필요한가요?"
    a: "필요합니다. 엔진오일과 브레이크액은 주행하지 않아도 시간이 지나면 상태가 나빠지고, 배터리는 세워 두는 동안 방전되기 쉽습니다. 로건서비스는 2016년부터 마세라티와 페라리만 전문으로 정비해 왔으니 점검 범위를 먼저 상담해 주세요."

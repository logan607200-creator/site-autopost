seo_title: "마세라티 기블리 V벨트 세트·브레이크패드 교체 | 로건서비스"
description: "갈라짐이 진행된 마세라티 기블리 V벨트를 베어링·텐셔너와 세트로 교체하고 브레이크패드도 바꾼 로건서비스 사례."
summary: "기블리 V벨트(겉벨트)에 갈라짐이 진행돼 있어 끊어지기 전에 벨트와 아이들 베어링 2개, 텐셔너를 세트로 교체했습니다. 브레이크패드도 마모 상태를 확인해 함께 교체했습니다."

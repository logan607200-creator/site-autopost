sections:
  - h2: 입고 점검
    text: |
      **기블리 V벨트(겉벨트)에 갈라짐이 진행된 상태를 육안 점검에서 확인했습니다.** 당장 끊어질 정도는 아니었지만 예방 차원에서 교체하기로 했습니다. 같은 입고에서 브레이크패드도 교체했습니다.

      V벨트는 마모되거나 갈라져도 계기판에 경고등이 켜지지 않습니다. 그래서 엔진오일을 갈거나 전체 점검을 할 때 벨트 표면을 직접 보는 것이 유일한 확인 방법입니다.
    photos:
      - {src: assets/cases/260212-maserati-ghibli-v-belt-brake-pad-02.webp, alt: "마세라티 기블리 입고 점검 사진 1"}
      - {src: assets/cases/260212-maserati-ghibli-v-belt-brake-pad-03.webp, alt: "마세라티 기블리 입고 점검 사진 2"}
  - h2: V벨트가 하는 일과 교체 기준
    text: |
      **V벨트는 발전기(제네레이터), 파워스티어링, 워터펌프, 에어컨 컴프레서를 함께 돌리는 벨트입니다.** 주행 중 끊어지면 시동이 꺼지거나 다시 걸리지 않을 수 있고, 워터펌프가 멈춰 엔진이 과열될 수도 있습니다.

      로건서비스는 V벨트 교체를 60,000km 전후로 안내하지만, 운전 습관과 주행 환경에 따라 마모 속도가 달라 주행거리보다 실제 상태를 기준으로 판단합니다.
    photos:
      - {src: assets/cases/260212-maserati-ghibli-v-belt-brake-pad-04.webp, alt: "마세라티 기블리 V벨트가 하는 일과 교체 기준 사진 1"}
      - {src: assets/cases/260212-maserati-ghibli-v-belt-brake-pad-05.webp, alt: "마세라티 기블리 V벨트가 하는 일과 교체 기준 사진 2"}
  - h2: 작업 — 벨트 세트 교체
    text: |
      **벨트만 바꾸지 않고 아이들 베어링 2개와 텐셔너까지 세트로 교체했습니다.** 벨트가 닳을 만큼 쓴 차라면 벨트를 받쳐 주는 베어링도 수명이 비슷하게 지났을 가능성이 높기 때문입니다. 한 번에 교체해 두면 다음 교체 시기도 함께 맞출 수 있습니다.

      작업 중 떼어 낸 부품은 전용 케미컬로 세척한 뒤 다시 장착했습니다.
    photos:
      - {src: assets/cases/260212-maserati-ghibli-v-belt-brake-pad-06.webp, alt: "마세라티 기블리 작업 — 벨트 세트 교체 사진 1"}
      - {src: assets/cases/260212-maserati-ghibli-v-belt-brake-pad-07.webp, alt: "마세라티 기블리 작업 — 벨트 세트 교체 사진 2"}
  - h2: 브레이크패드 교체
    text: |
      **브레이크패드는 떼어 낸 패드와 새 패드를 나란히 놓고 마모 정도를 확인한 뒤 교체했습니다.** 패드가 많이 닳으면 제동할 때 소음이나 떨림이 생기고, 평소보다 차가 밀리는 느낌이 들 수 있습니다.

      마세라티 브레이크패드는 대략 15,000~20,000km 사이에서 교체 시기가 오며, 남은 두께가 3mm 이하이면 바로 교체합니다. 마모가 심한 상태로 계속 타면 제동 거리가 길어지고 브레이크 오일이 과열되는 베이퍼록 위험도 커집니다.

      비슷한 시기가 됐다면 점검 때 벨트 표면과 패드 두께를 함께 확인해 보시길 권합니다. 계기판이나 부품 사진을 카톡으로 먼저 보내 주셔도 됩니다.
    photos:
      - {src: assets/cases/260212-maserati-ghibli-v-belt-brake-pad-08.webp, alt: "마세라티 기블리 브레이크패드 교체 사진 1"}
faq:
  - q: "기블리 V벨트는 경고등으로 알 수 있나요?"
    a: "아닙니다. V벨트는 갈라지거나 닳아도 경고등이 켜지지 않아, 엔진오일 교환이나 정기 점검 때 눈으로 직접 확인해야 합니다."
  - q: "V벨트만 교체하면 안 되나요?"
    a: "벨트가 닳았다면 아이들 베어링과 텐셔너도 비슷하게 사용된 상태일 가능성이 높습니다. 그래서 로건서비스는 벨트, 아이들 베어링, 텐셔너를 세트로 교체합니다."

sections:
  - h2: 입고 점검
    text: |
      **콰트로포르테(M156)를 점검한 결과 파워스티어링 펌프와 후방 리테이너 두 곳에서 누유가 확인됐습니다.** 두 곳 모두 수리하기로 하고 파워스티어링 펌프부터 작업했습니다.
    photos:
      - {src: assets/cases/250516-maserati-quattroporte-power-steering-pump-02.webp, alt: "마세라티 콰트로포르테 파워스티어링 펌프·후방 리테이너 누유 — 입고 점검"}
      - {src: assets/cases/250516-maserati-quattroporte-power-steering-pump-03.webp, alt: "마세라티 콰트로포르테 파워스티어링 펌프·후방 리테이너 누유 — 입고 점검 (2)"}
  - h2: 파워스티어링 펌프 교체
    text: |
      **파워스티어링 펌프는 엔진 동력으로 유압을 만들어 핸들을 가볍게 돌릴 수 있게 하는 부품입니다.** 펌프에서 오일이 새거나 압력이 떨어지면 핸들이 무거워지고 소음이 나 교체가 필요합니다.

      콰트로포르테의 펌프는 엔진룸 아래쪽, 엔진 측면 깊숙이 V벨트와 연결돼 있어 주변 보조 장치를 일부 떼어 내야 손이 닿습니다. 기존 오일을 모두 빼고 펌프를 교체한 뒤 호스 연결부에 누유가 없는지 확인했습니다. 새 오일을 채운 다음 핸들을 좌우로 여러 번 돌려 계통 안의 에어를 뺐습니다.
    photos:
      - {src: assets/cases/250516-maserati-quattroporte-power-steering-pump-04.webp, alt: "마세라티 콰트로포르테 파워스티어링 펌프·후방 리테이너 누유 — 파워스티어링 펌프 교체"}
      - {src: assets/cases/250516-maserati-quattroporte-power-steering-pump-05.webp, alt: "마세라티 콰트로포르테 파워스티어링 펌프·후방 리테이너 누유 — 파워스티어링 펌프 교체 (2)"}
  - h2: 후방 리테이너 씰 교환
    text: |
      **ZF 8단 미션을 내린 뒤 리어 크랭크샤프트 리테이너(후방 센터 리테이너)의 누유를 확인하고 오일 씰을 교환했습니다.** 고무 씰이 오래 쓰여 굳거나 닳으면 밀폐력이 떨어져 이 자리로 엔진오일이 샙니다. 마세라티 누유 수리에서 자주 만나는 위치입니다.
    photos:
      - {src: assets/cases/250516-maserati-quattroporte-power-steering-pump-06.webp, alt: "마세라티 콰트로포르테 파워스티어링 펌프·후방 리테이너 누유 — 후방 리테이너 씰 교환"}
      - {src: assets/cases/250516-maserati-quattroporte-power-steering-pump-07.webp, alt: "마세라티 콰트로포르테 파워스티어링 펌프·후방 리테이너 누유 — 후방 리테이너 씰 교환 (2)"}
  - h2: 출고 점검
    text: |
      **작업을 마친 뒤 시운전을 충분히 하며 누유와 조향 상태를 다시 확인하고 출고했습니다.**

      핸들이 전보다 무겁거나 돌릴 때 소리가 난다면 파워스티어링 계통 점검을 권합니다. 차 밑 오일 자국이나 누유 부위 사진을 카톡으로 먼저 보내 주세요.
    photos:
      - {src: assets/cases/250516-maserati-quattroporte-power-steering-pump-08.webp, alt: "마세라티 콰트로포르테 파워스티어링 펌프·후방 리테이너 누유 — 출고 점검"}
faq:
  - q: "파워스티어링 펌프가 새면 어떤 증상이 있나요?"
    a: "유압이 떨어져 핸들이 무거워지고, 돌릴 때 소음이 날 수 있습니다. 펌프 자체에서 누유가 있으면 교체해야 합니다."

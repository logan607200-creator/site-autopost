seo_title: "마세라티 기블리 엔진경고등, PCV 밸브·캐니스터 교체 | 로건서비스"
description: "증발가스 누출 코드가 뜬 마세라티 기블리의 PCV 밸브와 캐니스터를 교체하고 오일류를 교환한 파주 로건서비스 사례."
summary: "기블리의 엔진경고등은 진단기에서 증발가스(EVAP) 계통 다량 누출 코드로 확인돼 PCV 밸브와 캐니스터 어셈블리를 교체했습니다. 같은 입고에서 교환 시기가 된 앞·뒤 디퍼렌셜 오일과 ZF 8단 미션오일·오일팬도 교환했습니다."

summary: "그란투리스모의 간헐적 F1미션 경고등과 2단 변속 제한은 F1 클러치 문제였습니다. 경고등이 다시 켜진 상태로 재입고해 진단기로 원인을 확인했고, 미션을 내려 클러치 세트와 스러스트 베어링, F1 릴레이를 교환했습니다."

description: "경고등 점등과 출력 저하, 가속 지연으로 입고된 마세라티 기블리(M157) 디젤을 점검해 EGR 밸브 카본 막힘을 확인하고, EGR 밸브와 인테이크 파이프·바이패스 라인을 함께 세척한 사례. 파주 로건서비스."
summary: "기블리(M157)의 경고등, 출력 저하, 가속 지연은 EGR 밸브에 카본이 쌓여 막힌 것이 원인이었습니다. EGR 밸브뿐 아니라 인테이크 파이프와 바이패스 라인까지 함께 세척하고, 시운전으로 경고등이 다시 켜지지 않는지 확인했습니다."

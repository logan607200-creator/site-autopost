description: "중고로 산 마세라티 기블리(M157) 가솔린의 엔진오일 누유를 성능보증으로 접수해 헤드가스켓, 프론트케이스, 후방 센터 리테이너를 수리하고 비보증 소모품까지 점검한 사례. 파주 로건서비스."
summary: "중고로 구입한 기블리(M157) V6 가솔린은 헤드가스켓, 프론트케이스, 후방 센터 리테이너 등 여러 곳에서 엔진오일이 새고 있었습니다. 성능보증 접수와 보험사 확인 후 엔진을 내려 가스켓·리테이너를 교환했고, 비보증 항목인 V벨트 세트·점화플러그·오일 세퍼레이터도 상태를 확인해 교환했습니다."

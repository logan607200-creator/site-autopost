summary: "엔진오일 교환과 전반 점검을 요청한 M157 기블리 V6에서 열과 유증기로 부풀어 변형된 인테이크 스페이서를 발견해 예방 차원에서 교체했습니다. 이어 엔진오일, 오일필터, 에어필터를 교환하고 오일 주기를 세팅했습니다."

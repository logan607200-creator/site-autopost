description: "엔진오일이 새던 마세라티 르반떼(M161)의 엔진을 내려 헤드 가스켓과 크랭크 오일씰을 정비한 파주 로건서비스 사례."
summary: "르반떼(M161) 엔진오일 누유를 잡기 위해 에어컨 냉매를 회수하고 엔진을 내린 뒤, 실린더 헤드 가스켓 교환, 전방 크랭크 오일씰(리테이너) 작업, 헤드커버 실링을 진행했습니다. 냉매 재충전과 진단기 점검, 시운전으로 누유와 작동 상태를 확인하고 출고했습니다."

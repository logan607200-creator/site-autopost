description: "엔진경고등이 켜진 채 들어온 마세라티 기블리에서 1번·6번 실린더 실화 고장코드가 나왔을 때, 점화 계통·스왑테스트·내시경·압축압력·오일 계통 순으로 원인을 좁혀 간 기록. 파주 마세라티 정비 로건서비스, 전국 탁송."
summary: "엔진경고등이 켜진 마세라티 기블리를 진단기로 확인하니 1번·6번 실린더 실화 고장코드가 저장돼 있었습니다. 부품을 먼저 바꾸지 않고 점화플러그·점화코일, 코일 스왑테스트, 연소실 내시경, 압축압력, 오일세퍼레이터 고무와 엔진오일 순으로 원인 후보를 하나씩 확인했습니다."

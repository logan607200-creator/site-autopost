sections:
  - h2: 입고와 점검
    text: |
      **운행 중 충격으로 하체가 손상된 기블리(M157)가 입고됐습니다.** 노후로 바꾸는 일반 하체 작업과 달리, 이번은 충격으로 상한 부품을 교환하는 작업이었습니다.

      로건서비스는 입고하면 차량 네 면을 사진으로 남겨 점검 사항을 기록하고 고객에게 알려 드립니다. 손상 부위를 확인한 뒤 쇼크업소버, 로우암, 타이로드, 너클을 함께 교환하기로 했습니다.
    photos:
      - {src: assets/cases/250421-maserati-ghibli-suspension-damage-02.webp, alt: "마세라티 기블리 입고와 점검 사진 1"}
      - {src: assets/cases/250421-maserati-ghibli-suspension-damage-03.webp, alt: "마세라티 기블리 입고와 점검 사진 2"}
  - h2: 쇼크업소버·로우암 교환
    text: |
      **마운트를 풀고 쇼크업소버를 떼어 내 보니 눈으로 봐도 누유와 변형이 있었습니다.** 신품 쇼크업소버로 교환했습니다.

      로우암은 위쪽에서 충격으로 휘어진 모양이 확인돼 역시 신품으로 바꿨습니다.
    photos:
      - {src: assets/cases/250421-maserati-ghibli-suspension-damage-04.webp, alt: "마세라티 기블리 쇼크업소버·로우암 교환 사진 1"}
      - {src: assets/cases/250421-maserati-ghibli-suspension-damage-05.webp, alt: "마세라티 기블리 쇼크업소버·로우암 교환 사진 2"}
  - h2: 타이로드·너클 교환
    text: |
      **타이로드는 스티어링 휠과 앞바퀴를 이어 조향이 되게 하는 부품으로, 이번 작업에서 함께 교환했습니다.**

      마지막으로 브레이크 디스크가 결합되는 너클을 교환했습니다. 너클은 노후로 바꾸는 일이 드문 부품이라, 교환이 필요했다는 것은 충격이 그만큼 컸다는 뜻입니다.
    photos:
      - {src: assets/cases/250421-maserati-ghibli-suspension-damage-06.webp, alt: "마세라티 기블리 타이로드·너클 교환 사진 1"}
      - {src: assets/cases/250421-maserati-ghibli-suspension-damage-07.webp, alt: "마세라티 기블리 타이로드·너클 교환 사진 2"}
  - h2: 마무리
    text: |
      **너클 교환 후 디스크를 다시 장착하고 언더커버까지 조립한 뒤 마지막 점검을 마쳤습니다.**

      요철이나 방지턱을 세게 지난 뒤 핸들이 한쪽으로 쏠리거나 하체에서 소리가 난다면 점검을 권합니다. 증상과 사진을 카톡으로 먼저 보내 주세요.
    photos:
      - {src: assets/cases/250421-maserati-ghibli-suspension-damage-08.webp, alt: "마세라티 기블리 마무리 사진 1"}
faq:
  - q: "하체에 충격을 받으면 어떤 부품을 보나요?"
    a: "이번 기블리처럼 쇼크업소버의 누유·변형, 로우암 휘어짐을 먼저 보고, 조향과 연결된 타이로드와 너클 상태도 함께 확인합니다."

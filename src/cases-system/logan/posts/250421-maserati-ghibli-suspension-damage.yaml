description: "운행 중 충격으로 하체가 손상된 마세라티 기블리(M157)의 쇼크업소버, 로우암, 타이로드, 너클을 신품으로 교환하고 디스크와 언더커버를 다시 장착해 점검한 사례. 파주 마세라티 전문 로건서비스."

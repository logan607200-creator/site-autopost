sections:
  - h2: 입고와 진단
    text: |
      **콰트로포르테(M156)를 진단기로 점검한 결과 서모스탯 관련 고장 코드가 확인됐습니다.** 로건서비스는 입고하면 차량 네 면을 사진으로 남기고 현재 상태를 고객에게 알려 드립니다. 이렇게 기록해 두면 나중에 생기는 문제도 원인을 빨리 찾을 수 있습니다.
    photos:
      - {src: assets/cases/250821-maserati-quattroporte-thermostat-02.webp, alt: "마세라티 콰트로포르테 입고와 진단 사진 1"}
      - {src: assets/cases/250821-maserati-quattroporte-thermostat-03.webp, alt: "마세라티 콰트로포르테 입고와 진단 사진 2"}
  - h2: 서모스탯 고장 때 나타나는 증상
    text: |
      **서모스탯은 냉각수 순환을 열고 닫아 엔진 온도를 조절하는 부품이라, 고장 나면 온도와 관련된 증상이 여러 가지로 나타납니다.**

      주행 중 엔진 온도가 비정상적으로 높거나 낮게 나오고, 냉각팬이 계속 돌거나 아예 돌지 않을 수 있습니다. 히터나 에어컨 성능이 떨어지거나 엔진경고등이 켜지기도 합니다. 방치하면 과열로 라디에이터나 냉각 호스가 터지는 2차 손상으로 번질 수 있습니다.
    photos:
      - {src: assets/cases/250821-maserati-quattroporte-thermostat-04.webp, alt: "마세라티 콰트로포르테 서모스탯 고장 때 나타나는 증상 사진 1"}
      - {src: assets/cases/250821-maserati-quattroporte-thermostat-05.webp, alt: "마세라티 콰트로포르테 서모스탯 고장 때 나타나는 증상 사진 2"}
  - h2: 작업 — 정품 서모스탯 교체
    text: |
      **기존 서모스탯을 떼어 내고 정품 신품으로 교체했습니다.** 로건서비스는 서모스탯만큼은 정품 사용을 권합니다. 애프터마켓 부품을 직접 시험해 본 결과 서모스탯은 품질 편차가 커 정품이 낫다고 판단했기 때문입니다.
    photos:
      - {src: assets/cases/250821-maserati-quattroporte-thermostat-06.webp, alt: "마세라티 콰트로포르테 작업 — 정품 서모스탯 교체 사진 1"}
      - {src: assets/cases/250821-maserati-quattroporte-thermostat-07.webp, alt: "마세라티 콰트로포르테 작업 — 정품 서모스탯 교체 사진 2"}
  - h2: 출고 점검
    text: |
      **시운전을 마친 뒤 진단기로 다시 확인해 수리가 제대로 된 것을 보고 출고했습니다.**

      점검 중 브레이크 디스크 마모도 확인됐습니다. 말로만 전하지 않고 정비 기록 프로그램에 등록한 뒤 고객에게 직접 설명했고, 다음 예약 입고 때 수리하기로 했습니다.

      수온 게이지가 요동치거나 히터가 약해졌다면 서모스탯 점검을 권합니다. 계기판 사진을 카톡으로 먼저 보내 주세요.
    photos:
      - {src: assets/cases/250821-maserati-quattroporte-thermostat-08.webp, alt: "마세라티 콰트로포르테 출고 점검 사진 1"}
faq:
  - q: "서모스탯 고장을 그냥 두면 어떻게 되나요?"
    a: "엔진 과열이나 과냉이 이어지고, 과열이 반복되면 라디에이터나 냉각 호스가 터지는 2차 손상으로 번질 수 있습니다. 증상이 보이면 빨리 점검받는 것이 좋습니다."

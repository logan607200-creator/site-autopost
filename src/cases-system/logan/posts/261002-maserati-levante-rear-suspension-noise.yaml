description: "뒤쪽 하체 소음으로 입고된 마세라티 르반떼(M161)를 점검해 리어 스태빌라이저, 토우로드, 찢어진 위시본 부싱을 교환한 사례. 파주 마세라티 전문 정비 로건서비스, 전국 탁송."

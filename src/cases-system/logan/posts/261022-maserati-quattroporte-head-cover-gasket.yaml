summary: "5세대 콰트로포르테의 엔진 상단 오일 비침은 헤드커버 가스켓 노후가 원인이었습니다. 헤드커버를 열어 가스켓과 플러그홀·솔레노이드 오링을 새것으로 바꾸고, 같은 분해 범위에 있는 점화플러그와 엔진오일·오일필터도 함께 교환했습니다."

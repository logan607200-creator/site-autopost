sections:
  - h2: 입고 경위
    text: |
      **다른 정비소에서 오일팬과 엔진 후방 누유 진단을 받은 르반떼(M161)가 정확한 진단을 위해 입고됐습니다.** 정밀 점검 결과 엔진 전방 리테이너와 미션 쪽 누유가 확인됐습니다.

      로건서비스는 고객이 작업 내용을 이해하기 쉽도록 작업 과정을 사진으로 기록합니다.
    photos:
      - {src: assets/cases/250425-maserati-levante-oil-leak-transmission-seal-02.webp, alt: "마세라티 르반떼 입고 경위 사진 1"}
      - {src: assets/cases/250425-maserati-levante-oil-leak-transmission-seal-03.webp, alt: "마세라티 르반떼 입고 경위 사진 2"}
  - h2: 전방 리테이너 교환
    text: |
      **누유가 확인된 엔진 전방 리테이너를 떼어 내고 신품으로 교환했습니다.**
    photos:
      - {src: assets/cases/250425-maserati-levante-oil-leak-transmission-seal-04.webp, alt: "마세라티 르반떼 전방 리테이너 교환 사진 1"}
      - {src: assets/cases/250425-maserati-levante-oil-leak-transmission-seal-05.webp, alt: "마세라티 르반떼 전방 리테이너 교환 사진 2"}
  - h2: 후방 누유 — 분해 후 원인이 달라짐
    text: |
      **처음에는 후방 센터 리테이너와 내부 부품 누유로 보았지만, 분해해 보니 리테이너가 아니라 트랜스미션 씰에서 오일이 새고 있었습니다.** 그래서 트랜스미션 씰을 수리했습니다.

      추가 누유가 없는지 다시 살펴보던 중 미션 안쪽 리테이너가 변형돼 그 틈으로 오일이 새는 것도 찾았습니다. 리테이너와 O링을 모두 교환했습니다.
    photos:
      - {src: assets/cases/250425-maserati-levante-oil-leak-transmission-seal-06.webp, alt: "마세라티 르반떼 후방 누유 — 분해 후 원인이 달라짐 사진 1"}
      - {src: assets/cases/250425-maserati-levante-oil-leak-transmission-seal-07.webp, alt: "마세라티 르반떼 후방 누유 — 분해 후 원인이 달라짐 사진 2"}
  - h2: 미션오일 교환과 마무리
    text: |
      **ZF 8단 미션오일과 오일팬을 교환해 미션 쪽 작업을 마무리했습니다.** 누유 수리는 작업 뒤 확인이 중요해, 주변을 깨끗이 세척하고 시운전한 다음 새로 묻어 나오는 오일이 없는지 마지막으로 점검했습니다.

      주차 자리에 오일 자국이 생기거나 다른 곳에서 누유 진단을 받았다면, 누유 부위 사진을 카톡으로 먼저 보내 주세요. 경기도 파주에 있지만 전국 탁송으로도 맡기실 수 있습니다.
    photos:
      - {src: assets/cases/250425-maserati-levante-oil-leak-transmission-seal-08.webp, alt: "마세라티 르반떼 미션오일 교환과 마무리 사진 1"}
faq:
  - q: "다른 곳에서 받은 누유 진단과 원인이 다를 수 있나요?"
    a: "이번 르반떼처럼 겉으로는 한 곳에서 새는 것 같아도, 분해해 보면 실제로 새는 부위가 다른 경우가 있습니다. 그래서 분해 후 다시 확인하고 추가 누유까지 점검합니다."

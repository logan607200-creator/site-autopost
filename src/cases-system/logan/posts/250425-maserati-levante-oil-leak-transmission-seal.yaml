summary: "르반떼(M161)는 정밀 점검에서 전방 리테이너와 미션 누유가 확인됐고, 후방 리테이너로 보였던 누유는 분해해 보니 트랜스미션 씰 누유였습니다. 전방 리테이너, 미션 씰, 변형된 미션 리테이너와 O링, ZF 8단 미션오일과 오일팬을 교환했습니다."

description: "V벨트(겉벨트)가 끊어져 입고된 마세라티 콰트로포르테 GTS의 엔진룸을 점검해 2차 손상이 없는 것을 확인하고, 엉킨 벨트를 제거한 뒤 신품 벨트와 베어링으로 교체한 사례. 파주 로건서비스."
summary: "V벨트가 끊어진 채 입고된 콰트로포르테 GTS는 엔진룸 점검에서 주변 부품의 2차 손상이 없었습니다. 끊어지며 엉킨 벨트를 모두 걷어 내고 신품 벨트와 베어링으로 교체한 뒤 시운전으로 확인했습니다."

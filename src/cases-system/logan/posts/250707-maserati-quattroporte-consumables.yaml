description: "소모품 교환 시기를 상담하러 온 마세라티 콰트로포르테(M139)를 기본 점검한 뒤 V벨트 세트, ZF 6단 미션오일·필터, 브레이크패드, 엔진오일을 교환하고 스로틀바디를 세척한 사례. 파주 로건서비스."
summary: "콰트로포르테(M139)는 기본 점검에서 V벨트가 교환 시기를 넘겨 마모·손상된 것이 확인돼, V벨트 세트·엔진오일·ZF 6단 미션오일·브레이크패드 네 가지를 교환했습니다. V벨트 작업 중 드러난 스로틀바디도 함께 세척했습니다."

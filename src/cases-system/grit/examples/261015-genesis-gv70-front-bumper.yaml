sections:
  - h2: 입고 상태
    text: |
      운정에 사시는 고객님이 아파트 지하주차장에서 회전하다 앞범퍼 오른쪽 아래를 기둥에 부딪혔다며 사진을 먼저 보내 주셨습니다. 사진으로 보면 범퍼 하단 모서리가 깨져 있고, 주변으로 긁힘이 넓게 퍼져 있었습니다.

      운행에는 문제가 없어 직접 몰고 입고하셨습니다. 계기판 경고등은 들어오지 않았지만, 앞범퍼에는 주차 센서가 달려 있어 겉모습만 보고 판단하지 않고 범퍼를 탈거해 안쪽까지 보기로 했습니다.

      최근 차량은 앞범퍼 안쪽에 주차 센서뿐 아니라 레이더나 카메라 같은 운전 보조 장치가 들어가 있는 경우가 많습니다. 범퍼는 플라스틱이라 충격을 받으면 모양이 돌아오기도 해서, 겉으로 보이는 깨짐보다 안쪽 손상이 더 클 때가 있습니다. 그래서 입고 첫 단계에서는 견적보다 먼저 손상 범위를 정확히 보는 데 시간을 씁니다.
  - h2: 손상 진단
    text: |
      범퍼 커버를 떼어 내고 안쪽을 확인했습니다. 앞범퍼 뒤에는 충격을 받아 주는 **보강재(백빔)** 와 흡수재, 센서를 잡아 주는 브래킷이 있습니다. 겉이 조금만 깨져도 이 부품들이 휘거나 브래킷이 부러지는 경우가 있어 하나씩 봤습니다.

      이번 차량은 보강재 변형이 없었고 흡수재도 눌린 자국 없이 제자리에 있었습니다. 센서 브래킷과 배선 커넥터도 정상이었습니다. 리프트에 올려 범퍼 아래 언더커버와 고정 클립도 확인했는데, 클립 몇 개가 빠진 것 말고는 이상이 없었습니다.

      깨진 부위가 플라스틱 커버의 끝 부분이라 보수를 해도 다시 갈라질 수 있는 위치였습니다. 고객님께 판금 보수와 커버 교환을 비교해 설명드렸고, 커버 교환으로 진행하기로 했습니다.
    photos:
      - {src: assets/grit-work-01.webp, alt: "리프트가 늘어선 그릿서비스 정비 작업장에서 하체를 점검하는 모습", caption: "리프트에 올려 범퍼 아래 언더커버와 고정 클립까지 확인했습니다."}
  - h2: 작업 과정
    text: |
      새 범퍼 커버는 도색되지 않은 상태로 들어옵니다. 표면을 다듬고 프라이머를 올린 뒤 도장 부스로 옮겼습니다.

      흰색은 같은 이름의 색이라도 차마다 톤이 조금씩 다릅니다. 차 도어 안쪽의 컬러 코드를 확인하고, 실제 차체 옆에 시편을 대 보며 조색을 맞췄습니다. 그다음 베이스 색과 투명 클리어를 차례로 올리고 부스 안에서 건조했습니다.

      건조가 끝난 범퍼에 주차 센서와 그릴, 안개등 커버를 옮겨 달고 차에 조립했습니다. 빠졌던 언더커버 클립도 새것으로 채웠습니다.

      범퍼를 조립할 때는 센서가 제 각도로 들어갔는지가 중요합니다. 센서가 조금만 기울어도 바닥이나 턱을 장애물로 잘못 읽어 경고음이 계속 울릴 수 있어, 센서 홀더를 하나씩 눌러 끝까지 끼워졌는지 확인했습니다.
    photos:
      - {src: assets/grit-work-02.webp, alt: "그릿서비스 도장 부스 거치대에 올려진 프라이머 작업 후 범퍼", caption: "프라이머를 올린 범퍼를 도장 부스에서 도색하기 전 모습입니다."}
  - h2: 출고 점검
    text: |
      조립 후 범퍼와 헤드램프, 펜더 사이 **단차와 틈**이 양쪽이 같은지 확인했습니다. 햇빛 아래로 차를 빼서 범퍼와 펜더 색이 이어지는지도 봤습니다.

      시동을 걸고 기어를 넣어 앞쪽 주차 센서가 거리마다 제대로 경고음을 내는지 확인했고, 계기판에 경고등이 없는 것을 본 뒤 출고했습니다. 고객님께는 교환한 범퍼 커버 사진과 안쪽 보강재 점검 사진을 함께 보내 드렸습니다.
    photos:
      - {src: assets/grit-care.webp, alt: "그릿서비스 작업장 앞에서 출고를 기다리는 흰색 제네시스 GV70", caption: "조립과 센서 점검을 마치고 출고를 기다리는 모습입니다."}
  - h2: 도색 후 관리 안내
    text: |
      새로 칠한 도장면은 겉으로는 말라 보여도 속까지 완전히 굳는 데 시간이 걸립니다. 업계에서는 보통 도색 후 2~4주 정도는 자동세차와 왁스·코팅을 피하고, 손세차도 고압수를 가까이 대지 않도록 안내하는 경우가 많습니다.

      새 범퍼에 새똥이나 수액이 묻으면 오래 두지 말고 물로 불려 부드럽게 닦아 주세요. 범퍼 아래쪽은 턱이나 주차 스토퍼에 다시 닿기 쉬운 곳이라, 지하주차장에서는 천천히 회전하는 것이 좋습니다.
faq:
  - q: "앞범퍼가 조금 깨졌는데 꼭 뜯어서 봐야 하나요?"
    a: "범퍼 뒤에는 보강재, 흡수재, 센서 브래킷이 있어 겉의 손상보다 안쪽이 더 다친 경우가 있습니다. 센서가 달린 차라면 탈거해서 확인하는 것이 안전합니다."
  - q: "범퍼는 판금과 교환 중 무엇이 나은가요?"
    a: "긁힘이나 작은 들어감은 보수와 도색으로 해결되는 경우가 많고, 끝부분이 깨졌거나 고정부가 부러졌다면 교환이 낫습니다. 차를 보고 두 방법을 비교해 설명드린 뒤 고객이 고른 작업만 진행합니다."
  - q: "도색한 범퍼는 언제부터 세차해도 되나요?"
    a: "도장면이 완전히 굳을 때까지 업계에서는 보통 2~4주 정도 자동세차와 왁스·코팅을 피하라고 안내합니다. 그 사이에는 오염물만 물로 부드럽게 씻어 주세요."

description: "주차장에서 앞범퍼가 깨진 제네시스 GV70. 범퍼 안쪽 보강재와 주차 센서를 점검하고 범퍼 교환·조색 도색 후 출고한 과정을 파주 그릿서비스가 사진으로 정리했습니다."
summary: "주차장 기둥에 부딪혀 앞범퍼 커버 하단이 깨진 GV70은 뜯어 보니 보강재와 센서 브래킷은 이상이 없어, 범퍼 커버만 교환하고 차 색에 맞춰 조색·도색한 뒤 센서 작동을 확인하고 출고했습니다."

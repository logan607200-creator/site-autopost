title: "BMW 5시리즈 브레이크 소음·패드 경고등, 앞 패드·디스크 교환"
seo_title: "BMW 5시리즈 브레이크 패드 경고등·소음 앞 패드·디스크 교환 | 파주 그릿서비스"
description: "제동할 때 쇠 긁는 소리와 브레이크 패드 경고등이 뜬 BMW 5시리즈. 패드·디스크 마모를 점검해 앞 패드와 디스크, 마모 센서를 교환한 과정을 파주 그릿서비스가 정리했습니다."
summary: "브레이크 패드 경고등과 제동 소음이 난 BMW 5시리즈는 앞 패드가 마모 한계에 닿아 디스크까지 긁고 있었고, 앞 패드·디스크·패드 마모 센서를 함께 교환한 뒤 시운전으로 소음과 경고등이 사라진 것을 확인했습니다."

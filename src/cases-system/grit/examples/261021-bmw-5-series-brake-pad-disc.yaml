cover: {src: assets/grit-work-01.webp, alt: "리프트가 늘어선 그릿서비스 정비 작업장, 안쪽 리프트에 바퀴를 뗀 BMW"}
sections:
  - h2: 입고 증상
    text: |
      금촌에서 오신 고객님이 "며칠 전부터 계기판에 브레이크 경고가 뜨고, 신호 대기 전에 멈출 때 쇠 긁는 소리가 난다"며 입고하셨습니다. 고속도로에서 속도를 줄일 때 핸들이 살짝 떨리는 느낌도 있다고 하셨습니다.

      BMW는 브레이크 패드에 **마모 센서**가 달려 있어 패드가 일정 두께 아래로 닳으면 계기판에 경고를 띄웁니다. 경고가 뜬 상태에서 쇠 긁는 소리까지 났다면 패드가 거의 남지 않았을 가능성이 높아 바로 점검했습니다.
  - h2: 점검·진단
    text: |
      차를 리프트에 올리고 앞바퀴를 떼어 브레이크를 확인했습니다. 앞 패드는 마찰재가 거의 남지 않아 일부는 바탕 철판이 디스크에 닿고 있었고, 디스크 표면에는 원을 따라 깊은 줄이 파여 있었습니다. 마모 센서도 끝부분이 닳아 끊어진 상태였습니다.

      디스크 옆면에는 그 이하로 쓰면 안 되는 **최소 두께**가 새겨져 있습니다. 측정해 보니 이미 그 기준에 가까웠고, 표면 줄 자국도 깊어 연마로 살리기 어려웠습니다. 뒤 브레이크는 패드가 아직 남아 있어 이번에는 교환하지 않고 상태만 기록해 두었습니다.
    photos:
      - {src: assets/grit-work-01.webp, alt: "그릿서비스 리프트 작업장에서 앞바퀴를 떼고 브레이크를 점검하는 BMW", caption: "리프트에 올려 앞바퀴를 떼고 패드와 디스크 마모를 확인했습니다."}
  - h2: 원인
    text: |
      쇠 긁는 소리는 닳은 패드의 바탕 철판이 디스크에 직접 닿아서 나는 소리입니다. 이 상태로 계속 타면 디스크가 깎이면서 제동 거리가 늘고, 디스크 면이 고르지 않게 닳아 감속할 때 핸들이 떨리는 원인이 됩니다.

      패드 경고등이 뜬 뒤에도 한동안 운행하는 경우가 많은데, 경고가 뜨면 되도록 빨리 점검을 받아야 디스크까지 바꾸는 일을 줄일 수 있습니다.

      브레이크 패드가 닳는 속도는 운전 습관과 길에 따라 차이가 큽니다. 신호가 잦은 시내 위주로 다니거나 언덕길이 많으면 같은 거리를 달려도 더 빨리 닳습니다. 그래서 주행거리만 보고 판단하기보다, 엔진오일 교환 같은 정기 정비 때 바퀴 사이로 패드 두께를 함께 봐 두는 것이 좋습니다.
  - h2: 작업 내용
    text: |
      고객님께 점검 사진을 보여 드리며 앞 패드만 바꾸는 경우와 디스크까지 바꾸는 경우를 비교해 설명드렸습니다. 깊게 파인 디스크에 새 패드만 달면 소음과 떨림이 남을 수 있어, 앞 패드·디스크·마모 센서를 함께 교환하기로 했습니다.

      캘리퍼를 떼어 슬라이드 핀을 청소하고 그리스를 새로 바른 뒤, 새 디스크와 패드를 장착했습니다. 마모 센서를 연결하고 휠 볼트는 규정 토크로 조였습니다. 마지막으로 진단기로 패드 교환 정보를 입력해 서비스 경고를 초기화했습니다.

      작업 중 브레이크액 색과 양도 함께 확인했습니다. 브레이크액은 시간이 지나면 수분을 머금어 성능이 떨어지는 소모품이라, 교환 시기가 됐는지 고객님께 따로 알려 드렸습니다. 이번에는 패드·디스크 교환만 진행했고, 나머지는 점검 결과로 기록해 두었습니다.
  - h2: 출고 점검과 관리 안내
    text: |
      시운전으로 저속·중속에서 여러 번 제동해 소음과 핸들 떨림이 없는 것을 확인했고, 계기판 경고등도 꺼진 것을 본 뒤 출고했습니다. 고객님께는 떼어 낸 패드와 디스크 사진을 새 부품 사진과 나란히 보내 드려, 얼마나 닳아 있었는지 직접 비교해 보실 수 있게 했습니다.

      새 패드와 디스크는 서로 면이 맞을 때까지 길들이는 시간이 필요합니다. 업계에서는 보통 교체 후 처음 수백 km 정도는 급제동을 피하고 부드럽게 제동하라고 안내합니다. 이번에 교환하지 않은 뒤 패드는 다음 정비 때 남은 두께를 다시 확인하기로 했습니다.
faq:
  - q: "브레이크 패드 경고등이 뜨면 바로 정비소에 가야 하나요?"
    a: "경고등은 패드가 교환 시점에 가까워졌다는 신호입니다. 바로 위험한 것은 아니지만, 쇠 긁는 소리가 함께 난다면 디스크까지 손상될 수 있어 가능한 한 빨리 점검을 받는 것이 좋습니다."
  - q: "패드만 바꾸면 안 되나요? 디스크도 꼭 바꿔야 하나요?"
    a: "디스크가 최소 두께보다 두껍고 표면 상태가 괜찮으면 패드만 교환할 수 있습니다. 최소 두께에 가깝거나 줄 자국이 깊으면 새 패드를 달아도 소음·떨림이 남을 수 있어 함께 교환을 권합니다."
  - q: "브레이크 교체 후 주의할 점이 있나요?"
    a: "새 패드와 디스크가 서로 길들여질 때까지 처음 수백 km 정도는 급제동을 피하는 것이 일반적인 안내입니다. 제동감이 이상하거나 소음이 다시 나면 바로 점검을 받으세요."

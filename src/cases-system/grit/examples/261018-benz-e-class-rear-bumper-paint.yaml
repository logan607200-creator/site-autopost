cover: {src: assets/grit-work-03.webp, alt: "그릿서비스 도색 준비 구역에 입고된 흰색 벤츠 E클래스"}
sections:
  - h2: 입고 상태
    text: |
      일산에서 오신 고객님 차량입니다. 상가 주차장에서 후진하다 차단용 볼라드에 리어범퍼 왼쪽 모서리가 닿았다고 하셨습니다. 모서리 부분이 안쪽으로 눌려 있었고, 그 주변으로 흰색 도장이 벗겨져 검은 바탕이 드러나 있었습니다.

      고객님이 가장 걱정하신 것은 "범퍼를 통째로 바꿔야 하는지"였습니다. 수입차 범퍼는 부품을 받는 데 시간이 걸리기도 하고, 센서가 달려 있어 교환 범위가 커질 수 있기 때문입니다.

      볼라드나 기둥처럼 단단하고 좁은 물체에 닿으면 힘이 한 점에 몰려 범퍼가 깊게 눌립니다. 겉에서는 도장만 벗겨진 것처럼 보여도 안쪽 플라스틱이 갈라졌는지, 범퍼를 잡아 주는 고정부가 밀렸는지에 따라 수리 방법이 달라집니다. 그래서 견적을 말씀드리기 전에 먼저 범퍼를 떼어 보기로 했습니다.
    photos:
      - {src: assets/grit-work-03.webp, alt: "도색 준비 구역에서 트렁크를 열고 작업을 기다리는 벤츠 E클래스", caption: "도색 준비 구역으로 옮겨 범퍼 탈거를 준비하는 모습입니다."}
  - h2: 손상 진단
    text: |
      범퍼를 떼어 안쪽을 보니 찍힌 자리 뒤의 플라스틱이 갈라지지 않고 눌리기만 한 상태였습니다. 범퍼를 차체에 거는 **고정 가이드**도 부러지지 않았고, 후방 주차 센서와 배선도 제자리에 있었습니다.

      이렇게 갈라짐 없이 눌린 손상은 열을 가해 원래 모양으로 펴는 판금 보수가 가능합니다. 반대로 모서리가 찢어졌거나 고정 가이드가 부러졌다면 보수 후에도 다시 벌어질 수 있어 교환을 권합니다. 이번에는 보수 쪽이 맞다고 판단해 고객님께 두 방법을 사진과 함께 설명드리고 판금 보수로 결정했습니다.
  - h2: 판금과 도색 과정
    text: |
      먼저 눌린 부분에 열을 가해 안쪽에서 밀어 원래 곡선을 살렸습니다. 완전히 매끈하게 펴지지 않는 미세한 굴곡은 퍼티로 얇게 메우고 갈아서 면을 맞췄습니다. 그 위에 프라이머를 올려 바탕을 정리했습니다.

      퍼티는 두껍게 올릴수록 나중에 갈라지거나 자국이 비칠 수 있어, 판금 단계에서 최대한 원래 모양에 가깝게 펴 두는 것이 중요합니다. 판금을 마친 뒤 형광등 아래에서 면을 비춰 보며 빛이 꺾이는 곳이 없는지 확인하고 다음 단계로 넘어갔습니다.

      도색 범위는 범퍼 한 판으로 정했습니다. 손상 부위만 작게 칠하면 경계가 눈에 띌 수 있어서, 범퍼 전체를 같은 색으로 올려야 옆 트렁크·펜더와 자연스럽게 이어집니다. 흰색 펄은 보는 각도에 따라 색이 달라 보이는 도료라, 시편을 몇 번 만들어 차체 옆에 대 보며 조색을 맞춘 뒤 도장 부스에서 베이스와 클리어를 올렸습니다.
    photos:
      - {src: assets/grit-work-02.webp, alt: "도장 부스 거치대에 올려 프라이머 작업을 마친 범퍼", caption: "판금과 프라이머를 마친 범퍼를 도장 부스로 옮긴 모습입니다."}
  - h2: 조립과 출고 점검
    text: |
      건조가 끝난 범퍼에 후방 센서를 다시 끼우고 차에 조립했습니다. 범퍼와 트렁크, 테일램프 사이 틈이 좌우로 같은지 확인했고, 실내등이 아닌 햇빛 아래에서 범퍼와 펜더 색이 이어지는지 다시 봤습니다.

      도장면은 손으로 쓸어 먼지 알갱이나 흘러내린 자국이 없는지 보고, 필요한 곳은 가볍게 연마해 광을 맞췄습니다. 후진 기어를 넣어 후방 센서 경고음이 정상으로 울리는 것까지 확인한 뒤 출고했습니다. 고객님께는 탈거한 범퍼 안쪽 사진과 판금 전후 사진을 같이 보내 드렸습니다.
  - h2: 부분도색, 이것만 알아두세요
    text: |
      **판금 보수가 가능한 경우:** 플라스틱이 갈라지지 않고 눌리기만 했을 때, 고정부가 살아 있을 때입니다. **교환이 나은 경우:** 찢어짐·구멍, 고정 가이드 파손, 센서 구멍 주변 변형이 있을 때입니다.

      도색 후에는 도장면이 완전히 굳을 때까지 시간이 필요합니다. 업계에서는 보통 2~4주 정도 자동세차와 왁스·코팅을 피하라고 안내하는 경우가 많습니다.
faq:
  - q: "범퍼 일부만 긁혔는데 범퍼 전체를 칠해야 하나요?"
    a: "손상 부위만 칠하면 경계가 보이기 쉬워, 보통 범퍼 한 판 단위로 도색합니다. 흰색 펄처럼 각도에 따라 색이 달라 보이는 도료는 특히 범위를 넉넉히 잡는 편입니다."
  - q: "수입차 범퍼도 판금으로 펼 수 있나요?"
    a: "국산차·수입차 상관없이 플라스틱이 갈라지지 않고 눌린 정도라면 판금 보수가 가능한 경우가 많습니다. 찢어졌거나 고정부가 부러졌다면 교환을 권합니다."

description: "엔진경고등과 냉각수경고등이 함께 켜진 벤츠 CLS400. 고장코드와 냉각계통을 점검해 보조워터펌프 두 개를 교환하고 에어빼기까지 마친 성능보증 수리 과정을 파주 그릿서비스가 정리했습니다."
summary: "엔진경고등과 냉각수경고등이 동시에 들어온 벤츠 CLS400은 냉각계통 점검 결과 보조워터펌프 교환이 필요했고, 중고차 성능보증 범위에서 1번·2번 보조워터펌프를 함께 교환한 뒤 에어빼기와 시운전으로 경고등 소등을 확인했습니다."

title: "BMW 640i 에어컨 바람 약함, 에바포레이터 누설 교환"
seo_title: "BMW 640i 에어컨 냉매 누설 에바포레이터 교환·성능보증보험 수리 | 파주 그릿서비스"
description: "중고로 산 BMW 640i의 에어컨 바람이 약해 냉매 압력과 누설을 점검하니 실내 에바포레이터에서 냉매가 새고 있었습니다. 성능보증보험 접수부터 교환까지 파주 그릿서비스가 정리했습니다."
summary: "BMW 640i 에어컨 냉방 약화는 대시보드 안 에바포레이터의 냉매 누설이 원인이었고, 중고차 성능보증보험 승인을 받은 뒤 에바포레이터와 배관 오링을 새것으로 바꾸고 진공·냉매 충전까지 마쳤습니다. 성능보증보험은 수리 전에 보험사 접수가 먼저입니다."

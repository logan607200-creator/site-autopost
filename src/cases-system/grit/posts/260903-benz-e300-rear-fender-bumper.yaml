description: "타이어 아치 위 라인이 눌린 흰색 벤츠 E300의 운전석 뒤휀더와 찍힌 뒤범퍼. 판금으로 면을 다시 잡고 하지작업과 조색 도장을 거쳐 출고한 과정을 파주 그릿서비스가 정리했습니다."
summary: "흰색 벤츠 E300의 운전석 뒤휀더는 타이어 아치 위 모서리 라인이 안쪽으로 눌려 판금으로 면과 라인을 먼저 복원했고, 뒤범퍼는 떼어 내 찍힌 곳을 퍼티로 메운 뒤 두 부위를 함께 조색·도장하고 단차와 색 경계를 확인해 출고했습니다."

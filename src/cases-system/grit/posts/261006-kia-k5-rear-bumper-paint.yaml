description: "뒤범퍼 왼쪽에 도장 손상이 생긴 기아 K5. 범퍼 소재 변형 여부를 먼저 진단하고 하도·조색·베이스·클리어 도장, 조립 검수까지 진행한 과정을 파주 그릿서비스가 정리했습니다."

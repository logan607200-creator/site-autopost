sections:
- h2: 입고와 하체 점검
  text: '마세라티 콰트로포르테를 리프트로 들어 올려 하체 전반을 점검하는 과정에서 로어암 상태를 확인했습니다.


    로어암은 바퀴와 차체를 이어 주면서 노면에서 올라오는 충격을 받아 주는 부품입니다. 사람 몸으로 치면 무릎 관절과 비슷한 자리에 있습니다. 로어암이 차체에 붙는 부분에는 고무로 된 **부싱**이 들어가는데, 이 부싱이 닳으면 핸들 떨림이나 주행 중 소음 같은 증상이 나타나는 것이 일반적입니다.

    '

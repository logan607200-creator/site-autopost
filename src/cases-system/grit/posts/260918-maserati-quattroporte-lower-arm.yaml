- h2: 교환 작업
  text: '좌우 로어암을 한쪽씩 차례로 떼어 내고 새 부품을 달았습니다. 떼어 낸 기존 부품과 새 부품을 나란히 놓으면 상태 차이가 눈으로도 구분됩니다. 장착 후에는 볼트를 규정 토크로 조여 마무리했습니다.

    '
  photos:
    - {src: assets/cases/260918-maserati-quattroporte-lower-arm-04.webp, alt: "마세라티 콰트로포르테 좌우 로어암 교환 — 교환 작업"}
    - {src: assets/cases/260918-maserati-quattroporte-lower-arm-05.webp, alt: "마세라티 콰트로포르테 좌우 로어암 교환 — 교환 작업 (2)"}
- h2: 휠 얼라인먼트와 출고 점검
  text: '로어암처럼 바퀴 위치를 잡아 주는 부품을 바꾸면 바퀴가 노면에 닿는 각도가 조금 달라질 수 있습니다. 그래서 교환 후에는 장비로 휠 얼라인먼트를 다시 맞췄습니다. 이 과정까지 마친 뒤 시운전으로 최종 상태를 확인하고 출고했습니다.


    로어암은 평소에 신경 쓸 일이 적은 부품이지만 주행 안정성과 직접 이어집니다. 정기 점검 때 하체를 함께 확인해 두는 것이 좋습니다.


    마세라티·페라리의 엔진·미션·전장 같은 전문 정비는 같은 그룹의 마세라티·페라리 전문 정비소 **로건서비스**(loganservice.co.kr)에서도 상담할 수 있습니다.

    '

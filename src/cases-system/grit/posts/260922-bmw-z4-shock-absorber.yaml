sections:
  - h2: 입고 증상
    text: |
      BMW Z4가 "달릴 때 하체에서 이상한 소리가 나고 승차감이 불안하다"는 증상으로 입고됐습니다. 고객님 설명을 바탕으로 서스펜션 계통을 중심으로 점검하기로 했습니다.
    photos:
      - {src: assets/cases/260922-bmw-z4-shock-absorber-02.webp, alt: "BMW Z4 하체 소음·승차감 불안, 쇽업쇼버 교환 — 입고 증상"}

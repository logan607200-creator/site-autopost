summary: "짝수단은 되는데 1·3·5단만 들어가지 않던 기아 스포티지는 클러치팩 마모, 클러치 엑추에이터 작동 이상, 더블 스러스트 베어링 마모가 겹친 것이 원인이었고, 성능보험사와 작업 범위를 협의해 승인된 부품을 새것으로 교환한 뒤 모든 단의 변속을 확인했습니다."

description: "뒤범퍼에 접촉 손상이 생긴 검은색 르노 SM6. 들뜸·어긋남까지 점검한 뒤 표면을 정리하고 색과 광을 맞춰 도장한 사고수리 과정을 파주 그릿서비스가 정리했습니다."

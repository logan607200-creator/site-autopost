summary: "중고차 성능보험으로 입고된 벤츠 E350 쿠페는 리프트 하부 점검에서 미션오일 팬과 엔진오일 팬 주변 두 곳의 누유가 확인됐고, 성능보험 절차에 따라 두 곳을 수리한 뒤 오일량 확인, 하부 세척, 누유 재점검과 시운전을 거쳐 출고했습니다."

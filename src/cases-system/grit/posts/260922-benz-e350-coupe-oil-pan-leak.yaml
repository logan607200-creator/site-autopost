sections:
  - h2: 입고 내용
    text: |
      벤츠 E350 쿠페가 중고차 성능보험 접수를 거쳐 입고됐습니다. 중고차를 산 뒤 성능·상태점검기록부 내용과 실제 차량 상태가 다르거나 보증 대상 부위에 문제가 확인되면, 보증 범위와 가입 조건에 따라 보험으로 수리할 수 있습니다.

      다만 모든 고장이 보상되는 것은 아닙니다. 차량 상태와 보증 범위, 보험사 심사 결과에 따라 적용 여부가 달라집니다.
    photos:
      - {src: assets/cases/260922-benz-e350-coupe-oil-pan-leak-02.webp, alt: "벤츠 E350 쿠페 입고 내용 사진 1"}
      - {src: assets/cases/260922-benz-e350-coupe-oil-pan-leak-03.webp, alt: "벤츠 E350 쿠페 입고 내용 사진 2"}
  - h2: 하부 점검 — 두 곳의 누유
    text: |
      차를 리프트에 올리고 엔진과 변속기 아래쪽을 중심으로 오일이 새는 곳을 찾았습니다. 크게 두 군데에서 오일이 배어 나온 흔적이 있었습니다.

      **① 미션오일 팬:** 변속기 아래쪽 미션오일 팬 주변에 누유 흔적이 있었습니다. 오일 팬과 체결부 주변을 자세히 살펴 실제로 어디서 새는지를 확인했습니다.

      **② 엔진오일 팬:** 엔진 아래쪽 엔진오일 팬 주변에서도 오일 흔적이 보였습니다. 오일이 묻어 있다는 것만으로 새는 곳을 단정하지 않고, 주변 부품과 연결부를 함께 확인해 정확한 위치를 찾았습니다. 위쪽에서 흘러내린 오일이 아래 부품에 묻어 있는 경우도 있기 때문입니다.
    photos:
      - {src: assets/cases/260922-benz-e350-coupe-oil-pan-leak-04.webp, alt: "벤츠 E350 쿠페 하부 점검 — 두 곳의 누유 사진 1"}
      - {src: assets/cases/260922-benz-e350-coupe-oil-pan-leak-05.webp, alt: "벤츠 E350 쿠페 하부 점검 — 두 곳의 누유 사진 2"}
  - h2: 원인
    text: |
      엔진과 변속기에는 각각 내부 부품의 윤활과 작동을 위한 오일이 들어 있습니다. 오일 팬과 맞닿는 결합부에는 오일이 밖으로 새지 않도록 개스킷이나 실링이 들어가는데, 주행거리와 사용 기간이 쌓이면서 밀폐 성능이 떨어질 수 있습니다.

      처음에는 오일이 살짝 배어 나오는 정도로 보이지만, 계속 새면 오염 범위가 넓어지고 오일량에도 영향을 줄 수 있습니다. 그래서 하부에 오일 흔적이 보이면 부품부터 바꾸기보다 정확한 누유 위치와 진행 정도를 먼저 확인합니다.
    photos:
      - {src: assets/cases/260922-benz-e350-coupe-oil-pan-leak-06.webp, alt: "벤츠 E350 쿠페 원인 사진 1"}
      - {src: assets/cases/260922-benz-e350-coupe-oil-pan-leak-07.webp, alt: "벤츠 E350 쿠페 원인 사진 2"}
  - h2: 수리와 출고 점검
    text: |
      점검 결과와 성능보험 절차에 따라 미션오일 팬 쪽과 엔진오일 팬 쪽 누유를 각각 수리했습니다.

      수리 후에는 오일 상태와 오일량을 확인하고, 하부를 세척한 뒤 다시 새는 곳이 없는지 점검했습니다. 세척 후 재점검을 해야 새로 배어 나오는 오일이 있는지 분명하게 보입니다. 마지막으로 시운전을 거쳐 차량 상태를 확인하고 출고했습니다.
    photos:
      - {src: assets/cases/260922-benz-e350-coupe-oil-pan-leak-08.webp, alt: "벤츠 E350 쿠페 수리와 출고 점검 사진 1"}
faq:
  - q: "중고차를 산 뒤 오일 누유가 발견되면 성능보험으로 수리할 수 있나요?"
    a: "성능·상태점검기록부와 다른 결함이 보증 대상 부위에서 확인되면 가능할 수 있습니다. 보증 범위, 가입 조건, 보험사 심사에 따라 달라지므로 먼저 진단과 보험 접수를 해야 합니다."
  - q: "하부에 오일이 묻어 있으면 그 자리가 새는 곳인가요?"
    a: "꼭 그렇지는 않습니다. 위에서 흘러내린 오일이 묻었을 수도 있어, 주변 부품과 연결부를 함께 확인해 실제 누유 위치를 찾습니다."

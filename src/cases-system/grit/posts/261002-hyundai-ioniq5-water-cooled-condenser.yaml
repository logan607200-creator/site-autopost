sections:
  - h2: 입고 내용
    text: |
      현대 아이오닉5가 에어컨 계통의 **수냉식 콘덴서** 교환으로 입고됐습니다. 차주님이 가입한 성능보증 상품으로 진행한 작업입니다.

      에어컨 바람이 덜 시원하다고 해서 원인이 늘 콘덴서에 있는 것은 아닙니다. 냉매 상태나 다른 부품 문제일 수도 있어서, 점검을 거쳐 필요한 작업을 정합니다. 에어컨 부품은 배관으로 서로 이어져 있으므로 부품 자체와 함께 연결 부위 상태도 살펴봐야 합니다.
    photos:
      - {src: assets/cases/261002-hyundai-ioniq5-water-cooled-condenser-02.webp, alt: "현대 아이오닉5 입고 내용 사진 1"}
      - {src: assets/cases/261002-hyundai-ioniq5-water-cooled-condenser-03.webp, alt: "현대 아이오닉5 입고 내용 사진 2"}
  - h2: 수냉식 콘덴서는 어떤 부품인가
    text: |
      자동차 에어컨 안에는 냉매가 돌면서 열을 옮깁니다. 실내에서 열을 받아 뜨거워진 냉매는 그 열을 어딘가에 내려놓아야 다시 차가운 바람을 만들 수 있습니다. 콘덴서는 뜨거운 기체 상태의 냉매에서 열을 빼앗아 액체로 바꿔 주는 부품입니다.

      콘덴서를 식히는 방법은 두 가지입니다. 바깥 공기를 불어 식히는 공랭식, 그리고 냉각수를 이용해 열을 넘겨받는 수냉식입니다. 수냉식에서는 냉매와 냉각수가 각자 다른 통로로 흐르고, 서로 섞이지 않은 채 열만 주고받습니다.

      이름 때문에 물을 넣는 부품으로 오해하기 쉽지만, 차량 규격에 맞는 냉각수가 도는 계통에 연결된 부품입니다. 에어컨 냉매와는 따로 관리해야 합니다.
    photos:
      - {src: assets/cases/261002-hyundai-ioniq5-water-cooled-condenser-04.webp, alt: "현대 아이오닉5 수냉식 콘덴서는 어떤 부품인가 사진 1"}
      - {src: assets/cases/261002-hyundai-ioniq5-water-cooled-condenser-05.webp, alt: "현대 아이오닉5 수냉식 콘덴서는 어떤 부품인가 사진 2"}
  - h2: 성능보증으로 진행한 교환
    text: |
      이번 차량은 성능보증 보장 범위 안에서 수냉식 콘덴서를 교환했습니다. 보증 적용은 가입한 상품의 조건과 보장 범위, 차량 상태에 따라 달라지기 때문에 같은 아이오닉5라도 똑같이 적용된다고 볼 수 없습니다.

      성능보증 정비를 문의할 때는 가입한 상품과 차량 정보를 함께 알려 주시면 필요한 작업과 보증 해당 여부를 확인하는 데 도움이 됩니다. 불편한 증상과 처음 나타난 시점도 같이 알려 주시면 좋습니다.
    photos:
      - {src: assets/cases/261002-hyundai-ioniq5-water-cooled-condenser-06.webp, alt: "현대 아이오닉5 성능보증으로 진행한 교환 사진 1"}
      - {src: assets/cases/261002-hyundai-ioniq5-water-cooled-condenser-07.webp, alt: "현대 아이오닉5 성능보증으로 진행한 교환 사진 2"}
  - h2: 교환 후 점검
    text: |
      콘덴서는 새 부품을 다는 것만큼 장착 후 확인이 중요합니다. 연결 부위에서 새는 곳이 없는지, 냉매와 냉각수 쪽 상태가 적정한지, 에어컨이 정상으로 작동하는지를 확인한 뒤 출고했습니다.

      차주님 눈에 잘 보이지 않는 부품일수록 무엇을 왜 바꿨는지 알기 쉽게 설명드리는 것도 정비의 일부라고 생각합니다.
    photos:
      - {src: assets/cases/261002-hyundai-ioniq5-water-cooled-condenser-08.webp, alt: "현대 아이오닉5 교환 후 점검 사진 1"}
faq:
  - q: "수냉식 콘덴서에 수돗물을 넣나요?"
    a: "아닙니다. 차량에 맞는 냉각수가 도는 계통에 연결되어 냉매의 열을 받아 가는 방식이며, 냉매와 냉각수는 섞이지 않고 각각 따로 관리합니다."
  - q: "성능보증 상품에 가입했으면 콘덴서 교환이 항상 보장되나요?"
    a: "가입 조건, 보장 범위, 차량 상태에 따라 달라집니다. 정비 전에 해당 부품이 보장되는지 먼저 확인하는 것이 좋습니다."
